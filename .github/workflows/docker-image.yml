# 构建 wechat-web 镜像并推送到 GitHub Container Registry（ghcr.io）。
#   推送到 main：     标签 latest、main、sha-<提交>
#   推送 v* 标签：    标签 1.2.3、1.2
#   Pull Request：   只测试和构建，不推送
name: 构建镜像

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "wechat-web/**"
      - ".github/workflows/docker-image.yml"
  pull_request:
    paths:
      - "wechat-web/**"
      - ".github/workflows/docker-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wechat-web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: wechat-web/go.mod
          cache-dependency-path: wechat-web/go.sum
      - run: go vet ./...
      - run: go test ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # ghcr.io 的镜像名必须是小写，仓库所有者 SmallSmartMouse 含大写字母。
      - name: 镜像名称
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wxrobot-web" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: wechat-web
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
