<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>执行诊断</title>
  <link rel="stylesheet" href="/debug.css">
</head>
<body>
<header class="top">
  <a href="/" class="back">‹ 消息台</a>
  <h1>执行诊断</h1>
  <span id="status" class="status" role="status"></span>
  <label class="auto"><input id="auto" type="checkbox" checked> 自动刷新</label>
  <button id="refresh">刷新</button>
</header>

<section class="cards">
  <div class="card" id="card-phone"></div>
  <div class="card" id="card-tasks"></div>
  <div class="card" id="card-events"></div>
</section>

<section>
  <div class="section-head">
    <h2>最近的异常与降级</h2>
    <small>手机上报。降级表示操作完成了，但用了不太可靠的办法（例如原图改用截图）或结果不完整（例如翻页提前停止）；同一问题 10 分钟内只记一条并累计次数。手机桥重启后清空。</small>
  </div>
  <div id="events" class="rows"></div>
</section>

<section>
  <div class="section-head">
    <h2>读写任务</h2>
    <nav class="tabs">
      <button data-filter="issues" class="selected">有问题的</button>
      <button data-filter="all">全部</button>
    </nav>
  </div>
  <small class="hint">点开任务查看每一步。已点击发送但结果未知的任务，请先核对手机再决定是否重发。</small>
  <div id="tasks" class="rows"></div>
</section>

<section>
  <div class="section-head"><h2>AI 自动回复</h2></div>
  <div id="jobs" class="rows"></div>
</section>

<section>
  <details id="log-box">
    <summary><h2>服务日志</h2><small id="log-note"></small></summary>
    <pre id="log"></pre>
  </details>
</section>

<script src="/debug.js"></script>
</body>
</html>
